<style>
        .glow-bg-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.2) 0%, rgba(20, 18, 29, 0) 70%);
            border-radius: 50%;
            animation: pulse 8s infinite alternate ease-in-out;
            pointer-events: none;
            z-index: 0;
        }
        .glow-bg-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(111, 0, 190, 0.15) 0%, rgba(20, 18, 29, 0) 70%);
            border-radius: 50%;
            animation: pulse 12s infinite alternate-reverse ease-in-out;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); opacity: 0.5; }
            100% { transform: scale(1.2) translate(5%, 5%); opacity: 1; }
        }
        
        .input-glass {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .input-glass:focus-within {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: rgba(124, 58, 237, 0.5);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);

<body class="bg-background text-text-primary min-h-screen flex items-center justify-center relative overflow-hidden font-body-lg selection:bg-primary-container selection:text-white">
<!-- Atmospheric Animated Background -->
<div class="glow-bg-1"></div>
<div class="glow-bg-2"></div>
<!-- Main Content Canvas -->
<main class="w-full max-w-md px-margin-mobile z-10 relative">
<!-- Glassmorphic Login Card -->
<div class="bg-surface/80 backdrop-blur-xl border border-white/10 rounded-[24px] p-stack-lg shadow-[0px_8px_32px_rgba(124,58,237,0.15)] flex flex-col items-center w-full">
<!-- Logo area -->
<div class="mb-stack-lg flex justify-center w-full">
<div class="h-20 w-20 bg-primary-container rounded-2xl flex items-center justify-center shadow-[0_0_20px_rgba(124,58,237,0.4)]"><img alt="RonkWS Logo" class="w-full h-full object-contain p-2" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAjg310hTc_6UwHDuIeZlxrAlE3cWAAOv8bBfVzZmcVZmQVBRA2fkkH0kG33Q6N6ZE94La0ta8gCRc1yBHdsCN7-G1S1Ck0MO0_sKmFEnELBMtRDyED4W-2NsEkiyB_Sso2B8WMQSnQz9M9iVI0icE7Mfbu-gVYjTh-2eXOYxQvPDQDW5TGDzf7AV_5K3gU28xgDkXykRRMgx1g02PMaNyvK278bU2i2cbMzdO6MLblcDOISsaI_kyFUkf_BhCxkicT_A"/></div>
</div>
<!-- Headers -->
<div class="text-center mb-stack-lg w-full">
<h1 class="font-headline-lg text-headline-lg text-text-primary mb-stack-sm md:font-headline-lg md:text-headline-lg font-headline-lg-mobile text-headline-lg-mobile">Sign In</h1>
<p class="font-body-sm text-body-sm text-text-secondary">Your streaming everything starts here.</p>
</div>
<!-- Form -->
<form class="w-full flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="input-glass rounded-[24px] flex items-center px-4 py-3">
<span class="material-symbols-outlined text-text-secondary mr-3 text-[20px]" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="bg-transparent border-none outline-none text-text-primary w-full font-body-lg placeholder:text-text-secondary/50" placeholder="Email address" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="input-glass rounded-[24px] flex items-center px-4 py-3">
<span class="material-symbols-outlined text-text-secondary mr-3 text-[20px]" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="bg-transparent border-none outline-none text-text-primary w-full font-body-lg placeholder:text-text-secondary/50" placeholder="Password" required="" type="password"/>
<button class="text-text-secondary hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
<!-- Actions -->
<div class="flex justify-end w-full mb-stack-sm">
<a class="font-label-md text-label-md text-primary hover:text-tertiary transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Primary Button -->
<button class="w-full bg-primary-container hover:bg-inverse-primary text-white font-title-md text-title-md rounded-[24px] py-3 transition-all duration-300 shadow-[0_4px_16px_rgba(124,58,237,0.3)] hover:shadow-[0_6px_24px_rgba(124,58,237,0.5)] active:scale-[0.98]" type="submit">
                    Sign In
                </button>
</form>
<!-- Secondary Action -->
<div class="mt-stack-lg w-full text-center">
<p class="font-body-sm text-body-sm text-text-secondary">
                    Don't have an account? 
                    <a class="text-primary font-title-md text-title-md !text-[14px] hover:text-tertiary transition-colors ml-1" href="#">Create Account</a>
</p>
</div>
</div>
</main>
